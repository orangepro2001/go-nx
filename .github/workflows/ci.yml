# CI for go-nx. Nothing here publishes, tags or releases: shipping stays with release.sh.
#
#   linux    formatting, vet (also for windows), tests with the race detector, and a build of
#            the portable core for other platforms
#   windows  builds and tests on a real Windows runner. The "real desktop" step paints on the
#            runner's desktop and moves its cursor (GO_NX_WINDOWS_E2E=1); it never runs by
#            default on a developer machine. See docs/ACCEPTANCE.md for what these do and
#            do not prove.

name: ci

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Ebiten links against X11/GL when it is built on Linux (internal/ui).
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxxf86vm-dev \
            xvfb libgl1-mesa-dri libglx-mesa0 libegl1 libegl-mesa0

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi

      - name: vet
        run: |
          go vet ./...
          GOOS=windows go vet ./...

      - name: test (race, coverage)
        run: go test -race -cover ./...

      # The interface toolkit draws with Ebiten, so its drawing tests need a display: a virtual
      # one here, the runner's desktop on Windows. (Without a display they skip themselves.)
      - name: interface drawing tests (Ebiten under Xvfb)
        run: xvfb-run -a -s "-screen 0 1280x800x24" go test -race -count=1 -v ./internal/ui/gfx

      # The real programs, as separate processes: nx-host in test mode (a synthetic screen,
      # input only logged) driven the way an application would, paired with nx-probe.
      - name: nx-host and nx-probe end to end
        run: |
          go build -o "$RUNNER_TEMP/nx-host" ./cmd/nx-host
          go build -o "$RUNNER_TEMP/nx-probe" ./cmd/nx-probe
          python3 scripts/e2e-host-probe.py --host "$RUNNER_TEMP/nx-host" --probe "$RUNNER_TEMP/nx-probe"

      # The core application (nx-host, nx-probe and their contracts, packed as released): a zip
      # built twice, each time with an empty build cache, has to be byte-identical.
      - name: core application builds reproducibly
        run: scripts/artifacts.sh --verify core

      # The Java API that package mobile binds to must not change by accident. This
      # generates the bindings only (no Android SDK or NDK) and compares their public API
      # with mobile/api.golden; gobind is installed on the runner at a pinned version.
      - name: mobile API (gomobile bindings)
        run: |
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867
          export PATH="$(go env GOPATH)/bin:$PATH"
          scripts/build-aar.sh --check-api

      # U0, the technical validation that precedes any interface work (docs/ui-baseline.md):
      # Ebiten under a virtual X server with Mesa's software GL. It checks the shader against
      # its formula, three-script text, a screenshot and ScheduleFrame, and keeps the report.
      - name: U0 spike (Ebiten under Xvfb)
        run: |
          go build -o "$RUNNER_TEMP/u0" ./tools/u0
          xvfb-run -a -s "-screen 0 1920x1200x24" "$RUNNER_TEMP/u0" all -seconds 3 -check \
            -png "$RUNNER_TEMP/u0-linux.png" -out "$RUNNER_TEMP/u0-linux.json" > /dev/null
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: u0-linux
          path: |
            ${{ runner.temp }}/u0-linux.json
            ${{ runner.temp }}/u0-linux.png
          if-no-files-found: ignore

      # The protocol/session core must stay free of UI and Windows-only imports.
      - name: portable core builds elsewhere
        run: |
          for target in linux/amd64 darwin/arm64 windows/amd64 android/arm64; do
            echo "== $target"
            GOOS=${target%/*} GOARCH=${target#*/} go build \
              ./internal/proto ./internal/tile ./internal/trust ./internal/remote \
              ./internal/synth ./internal/logsink ./internal/probe ./internal/hostd ./internal/view ./mobile
          done

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: unit tests
        run: go test -count=1 ./...

      # What self-update relies on: a running exe can be renamed but not deleted.
      # -v so that the log shows the evidence (docs/ACCEPTANCE.md, section 2).
      - name: self-update on a running exe
        run: go test -count=1 -v -run 'TestReplaceOfARunningExe|TestARunningBackupCopyTakesTheRealNameBack' ./internal/update

      - name: nx-host and nx-probe end to end
        run: |
          go build -o "$RUNNER_TEMP/nx-host.exe" ./cmd/nx-host
          go build -o "$RUNNER_TEMP/nx-probe.exe" ./cmd/nx-probe
          python scripts/e2e-host-probe.py --host "$RUNNER_TEMP/nx-host.exe" --probe "$RUNNER_TEMP/nx-probe.exe"

      # The hosted runner has an interactive 1024x768 desktop that GDI can capture and
      # SendInput can drive (docs/ACCEPTANCE.md, section 1b), so this blocks.
      - name: real desktop smoke (capture, inject)
        env:
          GO_NX_WINDOWS_E2E: "1"
        # -p 1 runs the packages one after the other: they share the desktop.
        run: go test -count=1 -p 1 -v ./internal/capture ./internal/inject

      # U0 on a real Windows desktop (DirectX 11, software rendering on the runner): fonts that
      # Windows ships, the shader, ScheduleFrame, idle cost, and keys injected into the window.
      - name: U0 spike (Ebiten on Windows)
        # Informational until it has run green here once: the runner's desktop, fonts and
        # focus behaviour are what is being found out.
        continue-on-error: true
        run: |
          go build -o "$RUNNER_TEMP/u0.exe" ./tools/u0
          "$RUNNER_TEMP/u0.exe" all -seconds 3 -check -png "$RUNNER_TEMP/u0-windows.png" -out "$RUNNER_TEMP/u0-windows.json" > /dev/null
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: u0-windows
          path: |
            ${{ runner.temp }}/u0-windows.json
            ${{ runner.temp }}/u0-windows.png
          if-no-files-found: ignore
